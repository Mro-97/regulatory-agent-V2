# Pre-commit — regulatory-code-standards v1.1
#
# Statut : BLOQUANT depuis §12 étape 7. Chaque hook refuse le commit en
# cas de régression (ruff format/check, mypy --strict, interrogate 95%,
# gitleaks). Aligné sur le workflow CI code-standards.yml.

fail_fast: false
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-format
        name: "ruff format"
      - id: ruff
        name: "ruff check"
        args: ["--fix", "--exit-non-zero-on-fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: "mypy --strict"
        additional_dependencies:
          - pydantic>=2.7
        args: ["--strict", "--no-warn-unused-ignores"]
        files: ^src/

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        name: "interrogate >= 95%"
        args: ["--config", "pyproject.toml"]
        files: ^src/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        name: "gitleaks secret scan"
