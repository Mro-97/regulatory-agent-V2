# regulatory-code-standards §12 étape 5 — pipeline CI BLOQUANT
#
# Bascule bloquante actée après l'étape 4 (mypy --strict = 0, ruff = 0,
# tests 180/180). Chaque job échoue la CI en cas de régression.
# radon / interrogate / vulture / pip-audit restent en `continue-on-error`
# tant que l'étape 6 (extractions §10) et l'étape 7 (activation portes
# secondaires) ne sont pas franchies.

name: code-standards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy radon vulture pip-audit interrogate import-linter pydantic pydantic-settings

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: mypy --strict src/
        run: mypy --strict src/

      - name: mypy --strict main.py
        run: mypy --strict main.py

      - name: mypy --strict scripts/
        run: mypy --strict scripts/

      - name: radon — complexité cyclomatique (seuil B, advisory §6)
        continue-on-error: true
        run: radon cc -s -n C src/

      - name: radon — indice de maintenabilité (seuil B, advisory §6)
        continue-on-error: true
        run: radon mi -n B src/

      - name: interrogate — docstrings ≥ 95% (advisory §6)
        continue-on-error: true
        run: interrogate -f 95 src/ || true

      - name: vulture — code mort (advisory §7)
        continue-on-error: true
        run: vulture src/ --min-confidence 80

      - name: pip-audit — vulnérabilités dépendances (advisory §7)
        continue-on-error: true
        run: pip-audit -r requirements.txt

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: pytest
        run: pytest -q
