# regulatory-code-standards §12 étape 7 — pipeline CI BLOQUANT complet
#
# Bascule bloquante actée après l'étape 4 (mypy --strict = 0, ruff = 0,
# tests 180/180) puis étendue en étape 7 aux portes secondaires §6/§7 :
# radon cc (seuil C, refactor du Retriever préalable D→C), radon mi
# (seuil B — tout à A actuellement), interrogate (95%), vulture,
# pip-audit. Chaque job échoue désormais la CI en cas de régression.

name: code-standards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy radon vulture pip-audit interrogate import-linter pydantic pydantic-settings

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: mypy --strict src/
        run: mypy --strict src/

      - name: mypy --strict main.py
        run: mypy --strict main.py

      - name: mypy --strict scripts/
        run: mypy --strict scripts/

      - name: radon — complexité cyclomatique (seuil C bloquant §6)
        # radon lui-même n'échoue jamais sur le rang ; on rend le job
        # bloquant en cherchant tout bloc de rang D, E ou F dans la
        # sortie complète. Les blocs C(11-20) restent tolérés (dérogation
        # étape 7 : refactor déterminé au cas par cas §12).
        run: |
          rapport=$(radon cc -s src/)
          echo "$rapport"
          if echo "$rapport" | grep -qE ' - [DEF] \([0-9]+\)$'; then
            echo "::error::radon cc — bloc de complexité D/E/F détecté (seuil C)."
            exit 1
          fi

      - name: radon — indice de maintenabilité (seuil B bloquant §6)
        # Idem : `radon mi -n B src/` liste les fichiers < B ; le job
        # échoue s'il en trouve un.
        run: |
          rapport=$(radon mi -n B src/)
          echo "$rapport"
          if [ -n "$rapport" ]; then
            echo "::error::radon mi — module d'indice de maintenabilité < B."
            exit 1
          fi

      - name: interrogate — docstrings ≥ 95% (bloquant §6)
        run: interrogate -f 95 src/

      - name: vulture — code mort (bloquant §7)
        run: vulture src/ --min-confidence 80

      - name: pip-audit — vulnérabilités dépendances (bloquant §7)
        run: pip-audit -r requirements.txt

      - name: import-linter — contrats d'architecture (bloquant §9)
        # 3 contrats dans .importlinter : src.api = frontière, src.models
        # = feuille, src.agents ne connaît pas l'orchestrateur ni l'API.
        run: lint-imports

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: pytest
        run: pytest -q
